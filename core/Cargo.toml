[package]
name = "mvs-core"
version = "3.0.0"
description = "Make Video Small engine: ffmpeg control, queue, presets, analysis, picture tools"
edition = "2021"
publish = false

[lib]
name = "mvs_core"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "sync", "time", "rt-multi-thread", "macros", "fs"] }
thiserror = "2"
sysinfo = "0.33"
nvml-wrapper = "0.10"
uuid = { version = "1", features = ["v4"] }
trash = "5"
parking_lot = "0.12"
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "download-binaries", "tls-native", "api-31"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Threading",
  "Win32_System_JobObjects",
] }

[dev-dependencies]
tempfile = "3"
