[package]
name = "mvs-slint-prototype"
version = "0.1.0"
edition = "2021"
description = "Prototype: Make Video Small with a native Slint interface instead of a web view"
publish = false

[dependencies]
# The same engine the real app uses.
mvs_lib = { package = "make-video-small", path = "../src-tauri" }
slint = { version = "1.18", features = ["image-default-formats"] }
rfd = "0.18"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
serde_json = "1"
parking_lot = "0.12"
uuid = { version = "1", features = ["v4"] }

[build-dependencies]
slint-build = "1.18"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
panic = "abort"
