[package]
name = "make-video-small"
version = "3.0.0"
description = "Make Video Small - video & image compression studio"
authors = ["Sahiljeet Singh Kalsi (GhostofWeb)"]
edition = "2021"
rust-version = "1.80"

[lib]
name = "mvs_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "sync", "time", "rt-multi-thread", "macros", "fs"] }
thiserror = "2"
ts-rs = "10"
sysinfo = "0.33"
nvml-wrapper = "0.10"
uuid = { version = "1", features = ["v4"] }
trash = "5"
parking_lot = "0.12"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Threading",
  "Win32_System_JobObjects",
] }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
panic = "abort"

[profile.dev]
debug = 1
